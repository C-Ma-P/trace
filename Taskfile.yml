version: '3'

vars:
  APP_NAME: trace
  APP_ID: trace
  APP_BIN: trace
  BIN_DIR: bin
  BUILD_BIN: '{{.BIN_DIR}}/{{.APP_BIN}}'
  ICON_SRC: build/appicon.png
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  DATABASE_URL: '{{.DATABASE_URL | default "postgres://meet:changeme@localhost:5432/trace?sslmode=disable"}}'
  INSTALL_DIR: '{{.HOME}}/.local/bin'
  TRACE_HOME: '{{.HOME}}/.trace'

tasks:
  common:install:frontend:deps:
    dir: frontend
    cmds:
      - npm install

  common:build:frontend:
    dir: frontend
    deps:
      - task: common:install:frontend:deps
    cmds:
      - npm run build

  common:dev:frontend:
    dir: frontend
    deps:
      - task: common:install:frontend:deps
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort

  linux:build:
    deps:
      - task: common:build:frontend
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -tags "{{.TAGS}}" -o {{.BUILD_BIN}}
    vars:
      TAGS: '{{if eq .DEV "true"}}webkit2_41{{else}}production,webkit2_41{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}}'

  run:
    cmds:
      - ./{{.BUILD_BIN}}

  install:
    deps:
      - task: linux:build
    cmds:
      - mkdir -p "{{.TRACE_HOME}}"
      - install -Dm755 "{{.BUILD_BIN}}" "{{.INSTALL_DIR}}/{{.APP_BIN}}"
      - install -Dm644 "{{.ICON_SRC}}" "$HOME/.local/share/icons/hicolor/256x256/apps/{{.APP_ID}}.png"
      - |
        mkdir -p "$HOME/.local/share/applications"
        cat > "$HOME/.local/share/applications/{{.APP_ID}}.desktop" <<EOF
        [Desktop Entry]
        Type=Application
        Name={{.APP_NAME}}
        Comment={{.APP_NAME}}
        Exec=$HOME/.local/bin/{{.APP_BIN}}
        Icon={{.APP_ID}}
        Terminal=false
        Categories=Utility;
        Keywords={{.APP_BIN}};{{.APP_NAME}};
        StartupNotify=true
        StartupWMClass={{.APP_BIN}}
        EOF
      - command -v desktop-file-validate >/dev/null && desktop-file-validate "$HOME/.local/share/applications/{{.APP_ID}}.desktop" || true
      - command -v kbuildsycoca6 >/dev/null && kbuildsycoca6 --noincremental || true
      - command -v kbuildsycoca5 >/dev/null && kbuildsycoca5 --noincremental || true
      - echo "Installed {{.APP_NAME}} to {{.INSTALL_DIR}}/{{.APP_BIN}}"

  uninstall:
    interactive: true
    cmds:
      - rm -f "{{.INSTALL_DIR}}/{{.APP_BIN}}"
      - rm -f "$HOME/.local/share/applications/{{.APP_ID}}.desktop"
      - rm -f "$HOME/.local/share/icons/hicolor/256x256/apps/{{.APP_ID}}.png"
      - command -v kbuildsycoca6 >/dev/null && kbuildsycoca6 --noincremental || true
      - command -v kbuildsycoca5 >/dev/null && kbuildsycoca5 --noincremental || true
      - |
        read -r -p "Remove {{.TRACE_HOME}} too? [Y/n] " confirm
        case "$confirm" in
          ""|[Yy])
            rm -rf "{{.TRACE_HOME}}"
            echo "Removed {{.TRACE_HOME}}"
            ;;
          *)
            echo "Kept {{.TRACE_HOME}}"
            ;;
        esac

  db:clear:components:
    interactive: true
    cmds:
      - |
        read -r -p "Delete all components from {{.DATABASE_URL}}? [Y/n] " confirm
        case "$confirm" in
          ""|[Yy])
            psql "{{.DATABASE_URL}}" -c 'delete from components;'
            ;;
          *)
            echo "Aborted."
            ;;
        esac

  db:clear:projects:
    interactive: true
    cmds:
      - |
        read -r -p "Delete all projects from {{.DATABASE_URL}}? [Y/n] " confirm
        case "$confirm" in
          ""|[Yy])
            psql "{{.DATABASE_URL}}" -c 'delete from projects;'
            ;;
          *)
            echo "Aborted."
            ;;
        esac

  state:clear:launcher-recents:
    interactive: true
    cmds:
      - |
        launcher_path="${HOME}/.trace/launcher.json"
        read -r -p "Delete launcher recent-project state at ${launcher_path}? [Y/n] " confirm
        case "$confirm" in
          ""|[Yy])
            rm -f "$launcher_path"
            echo "Deleted ${launcher_path}"
            ;;
          *)
            echo "Aborted."
            ;;
        esac
